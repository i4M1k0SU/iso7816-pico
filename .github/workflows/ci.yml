name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The firmware jobs get the Pico SDK, the Arm GNU Toolchain and picotool / pioasm from the setup-pico-toolchain
# composite action (.github/actions), which keeps them in the Actions cache; release.yml uses the same action.
jobs:
  host-tests:
    name: Host tests (protocol and APDU layers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-tests
      - name: Test
        run: ctest --test-dir build-tests --output-on-failure

  host-tests-sanitize:
    name: Host tests (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug -DISO7816_TESTS_SANITIZE=ON
      - name: Build
        run: cmake --build build-tests
      - name: Test
        run: ctest --test-dir build-tests --output-on-failure

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install clang-tidy
        run: pip install clang-tidy==23.1.4
      - name: Configure the host tests (compile_commands.json)
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Check every host-built C file against .clang-tidy
        run: jq -r '.[].file' build-tests/compile_commands.json | xargs clang-tidy -p build-tests --quiet

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install clang-format
        run: pip install clang-format==18.1.8
      - name: Check every C file against .clang-format
        run: git ls-files '*.c' '*.h' | xargs clang-format --dry-run -Werror --style=file

  firmware:
    name: Demo firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [pico, pico2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pico-toolchain
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DPICO_SDK_PATH=$PICO_TOOLS/pico-sdk
          -Dpicotool_DIR=$PICO_TOOLS/picotool
          -Dpioasm_DIR=$PICO_TOOLS/pioasm
          -DPICO_BOARD=${{ matrix.board }}
      - name: Build
        run: cmake --build build
      - name: Upload the UF2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso7816-pico-demo-${{ matrix.board }}
          path: build/examples/demo/iso7816-pico-demo.uf2

  embedding:
    name: Embedding contract (tests/embed, ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [pico, pico2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pico-toolchain
      - name: Configure a consumer project
        run: >
          cmake -S tests/embed -B build-embed -G Ninja
          -DPICO_SDK_PATH=$PICO_TOOLS/pico-sdk
          -Dpicotool_DIR=$PICO_TOOLS/picotool
          -Dpioasm_DIR=$PICO_TOOLS/pioasm
          -DPICO_BOARD=${{ matrix.board }}
      - name: Build
        run: cmake --build build-embed

  fuzz:
    name: Fuzzers (libFuzzer, corpus regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: CC=clang cmake -S tests/fuzz -B build-fuzz
      - name: Build
        run: cmake --build build-fuzz -j "$(nproc)"
      # Every harness replays its committed corpus first (a crash there fails at once), then mutates it for 20 s.
      - name: Run
        run: |
          set -euo pipefail
          for h in apdu atr pps t0 t1 nvm; do
            echo "::group::fuzz_$h"
            mkdir -p "build-fuzz/work/$h"
            build-fuzz/fuzz_$h -max_total_time=20 -max_len=4096 -timeout=10 -print_final_stats=1 \
              -artifact_prefix="build-fuzz/work/$h-" "build-fuzz/work/$h" "tests/fuzz/corpus/$h"
            echo "::endgroup::"
          done
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: build-fuzz/work/*-*
