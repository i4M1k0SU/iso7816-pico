name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (protocol and APDU layers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-tests
      - name: Test
        run: ctest --test-dir build-tests --output-on-failure

  firmware:
    name: Firmware (RP2040)
    runs-on: ubuntu-24.04
    env:
      PICO_SDK_VERSION: 2.3.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the Pico SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_VERSION }}
          submodules: true
          path: pico-sdk
      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            ninja-build libusb-1.0-0-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk
      - name: Build
        run: cmake --build build
      - name: Upload the UF2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso7816-pico-uf2
          path: build/iso7816-pico.uf2
