name: Set up the Pico SDK and tools
description: >
  Restores (or downloads and caches) the Pico SDK, the Arm GNU Toolchain and the prebuilt picotool / pioasm in
  ~/pico-tools, puts the toolchain on PATH and exports PICO_TOOLS for the cmake invocation.

# The versions are the ones the Pico VS Code extension uses (toolchainVersion / picotoolVersion in CMakeLists.txt):
# Arm GNU Toolchain 15.2.Rel1 and the prebuilt picotool / pioasm 2.3.1 from pico-sdk-tools, so the SDK neither needs a
# distribution toolchain nor builds the host tools from source. They and the SDK are downloaded once into ~/pico-tools
# and kept in the Actions cache, keyed on the versions below (changing one of them starts a new cache).
inputs:
  sdk-version:
    description: Pico SDK tag
    default: 2.3.1
  arm-version:
    description: Arm GNU Toolchain version (as in its download URL)
    default: 15.2.rel1
  arm-sha256:
    description: SHA-256 of the x86_64 arm-none-eabi tarball
    default: 597893282ac8c6ab1a4073977f2362990184599643b4c5ee34870a8215783a16
  tools-release:
    description: raspberrypi/pico-sdk-tools release tag
    default: v2.3.1-0
  picotool-sha256:
    description: SHA-256 of the picotool tarball
    default: 878a1a1e7d8336b8be60300c7218f366d9790c0d3a211b181d6d172e80b1248e
  pioasm-sha256:
    description: SHA-256 of the pico-sdk-tools (pioasm) tarball
    default: 39758f147a8e615f8c77586ce3c85a25c6728910a86612eea184fc86eb606992

runs:
  using: composite
  steps:
    - name: Restore the Pico SDK and tools
      id: tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/pico-tools
        key: pico-${{ inputs.sdk-version }}-arm-${{ inputs.arm-version }}-${{ inputs.tools-release }}
    - name: Download the Pico SDK and tools
      if: steps.tools.outputs.cache-hit != 'true'
      shell: bash
      env:
        PICO_SDK_VERSION: ${{ inputs.sdk-version }}
        ARM_TOOLCHAIN_VERSION: ${{ inputs.arm-version }}
        ARM_TOOLCHAIN_SHA256: ${{ inputs.arm-sha256 }}
        PICO_SDK_TOOLS_RELEASE: ${{ inputs.tools-release }}
        PICOTOOL_SHA256: ${{ inputs.picotool-sha256 }}
        PIOASM_SHA256: ${{ inputs.pioasm-sha256 }}
      run: |
        set -euo pipefail
        T="$HOME/pico-tools"
        D="$RUNNER_TEMP/downloads"
        mkdir -p "$T" "$D"
        # Only lib/tinyusb (pico_stdio_usb) is needed; btstack, lwip, mbedtls and cyw43-driver are not.
        git clone -q --depth 1 --branch "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk.git "$T/pico-sdk"
        git -C "$T/pico-sdk" submodule update -q --init --depth 1 lib/tinyusb
        arm=https://armkeil.blob.core.windows.net/developer/files/downloads/gnu/$ARM_TOOLCHAIN_VERSION/binrel
        arm=$arm/arm-gnu-toolchain-$ARM_TOOLCHAIN_VERSION-x86_64-arm-none-eabi.tar.xz
        rel=https://github.com/raspberrypi/pico-sdk-tools/releases/download/$PICO_SDK_TOOLS_RELEASE
        ver=${PICO_SDK_TOOLS_RELEASE#v}
        ver=${ver%-*}
        curl -sSfL --retry 3 -o "$D/arm.tar.xz" "$arm"
        curl -sSfL --retry 3 -o "$D/picotool.tar.gz" "$rel/picotool-$ver-x86_64-lin.tar.gz"
        curl -sSfL --retry 3 -o "$D/pioasm.tar.gz" "$rel/pico-sdk-tools-$ver-x86_64-lin.tar.gz"
        sha256sum -c <<SUMS
        $ARM_TOOLCHAIN_SHA256  $D/arm.tar.xz
        $PICOTOOL_SHA256  $D/picotool.tar.gz
        $PIOASM_SHA256  $D/pioasm.tar.gz
        SUMS
        mkdir "$T/arm-none-eabi"
        tar -xJf "$D/arm.tar.xz" -C "$T/arm-none-eabi" --strip-components=1 \
          --exclude='*/share/doc' --exclude='*/share/info' --exclude='*/share/man'
        tar -xzf "$D/picotool.tar.gz" -C "$T" picotool
        tar -xzf "$D/pioasm.tar.gz" -C "$T" pioasm
    - name: Put the tools on PATH
      shell: bash
      run: |
        echo "PICO_TOOLS=$HOME/pico-tools" >> "$GITHUB_ENV"
        echo "$HOME/pico-tools/arm-none-eabi/bin" >> "$GITHUB_PATH"
        "$HOME/pico-tools/arm-none-eabi/bin/arm-none-eabi-gcc" --version | head -1
        "$HOME/pico-tools/picotool/picotool" version
        echo "ninja $(ninja --version)"
